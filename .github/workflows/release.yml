name: release

# Tag a version (v0.9.0) and push: the binary tarball lands on the
# private GitHub Release. No public repos involved.
#
# Builds inside an Arch container (same libs as dev: current gtk4,
# libadwaita, gtk4-layer-shell). Ubuntu runners ship GTK 4.14, too
# old for our gtk4 crate (>= 4.21), and have no layer-shell package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: System deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            gtk4 libadwaita gtk4-layer-shell alsa-lib \
            pkgconf curl ca-certificates github-cli
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin mywhisper-app
      - name: Tarball
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          STAGE="mywhisper-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "$STAGE"
          cp target/release/mywhisper-app "$STAGE/"
          cp packaging/systemd/mywhisper.service "$STAGE/"
          cp assets/applications/com.mywhisper.App.desktop "$STAGE/"
          cp assets/icons/app-icon.svg "$STAGE/com.mywhisper.App.svg"
          cp assets/icons/symbolic.svg "$STAGE/com.mywhisper.App-symbolic.svg"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "TARBALL=$STAGE.tar.gz" >> "$GITHUB_ENV"
      - name: Release
        run: gh release create "${GITHUB_REF#refs/tags/}" "$TARBALL" --title "${GITHUB_REF#refs/tags/}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

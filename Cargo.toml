[package]
name = "mywhisper"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
evdev = "0.13.2"
fs2 = "0.4.3"
getrandom = "0.4.3"
gtk4 = { version = "0.11.5", features = ["v4_22"] }
gtk4-layer-shell = "0.8.1"
keyring = "4.2.0"
libadwaita = "0.9.2"
mdns-sd = "0.21.5"
rodio = "0.22.2"
rusqlite = { version = "0.40.2", features = ["bundled", "bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snow = "0.10.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

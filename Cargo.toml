[package]
name = "mywhisper"
version = "0.9.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bzip2 = "0.6.1"
cpal = "0.18.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
evdev = "0.13.2"
fs2 = "0.4.3"
getrandom = "0.4.3"
gtk4 = { version = "0.11.5", features = ["v4_22"] }
gtk4-layer-shell = "0.8.1"
keyring = "4.2.0"
libadwaita = "0.9.2"
mdns-sd = "0.21.5"
reqwest = { version = "0.13.5", features = ["blocking"] }
rodio = "0.22.2"
rusqlite = { version = "0.40.2", features = ["bundled", "bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
snow = "0.10.0"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["rt"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zbus = "5.19.0"
zip = "8.6.0"
